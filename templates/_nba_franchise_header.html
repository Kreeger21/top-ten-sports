<nav class="top-nav"><a href="{{ url_for('franchise_home') }}">← Franchise hub</a><span>{{ snapshot }} snapshot</span></nav>
<header class="franchise-team-hero"><div><p class="eyebrow">NBA Franchise Mode</p><h1>{{ team.city }} {{ team.name }}</h1><p class="intro">{{ team.conference }} · {{ team.division }} Division</p></div><form method="get"><label for="team-select"><span>Control a team</span></label><select id="team-select" name="team" onchange="this.form.submit()">{% for option in teams %}<option value="{{ option.code }}" {% if option.code == team.code %}selected{% endif %}>{{ option.city }} {{ option.name }}</option>{% endfor %}</select></form></header>
